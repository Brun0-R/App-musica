name: Build APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: Download Gradle wrapper jar
        run: |
          curl -sL "https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Generate local.properties
        run: |
          FLUTTER_SDK=$(dirname $(dirname $(readlink -f $(which flutter))))
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          echo "=== local.properties ==="
          cat android/local.properties
          echo "=== Flutter SDK exists? ==="
          ls "$FLUTTER_SDK/packages/flutter_tools/gradle/" | head -5

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK
        id: build_apk
        run: flutter build apk --release 2>&1 | tee /tmp/build.log
        continue-on-error: true

      - name: Upload build log on failure
        if: steps.build_apk.outcome == 'failure'
        run: |
          LOG_URL=$(curl -s --upload-file /tmp/build.log https://transfer.sh/musica-build-log.txt)
          echo "### Build Failed - Log:" >> $GITHUB_STEP_SUMMARY
          echo "$LOG_URL" >> $GITHUB_STEP_SUMMARY
          echo "Error URL: $LOG_URL"
          exit 1

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: musica-app
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Musica APK - Build ${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
