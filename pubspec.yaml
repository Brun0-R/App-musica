name: musica
description: App de música personal - Reproduce música de YouTube
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  youtube_explode_dart: ^2.2.1
  just_audio: ^0.9.39
  audio_service: ^0.18.13
  audio_session: ^0.1.21
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  permission_handler: ^11.3.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  rxdart: ^0.28.0
  uuid: ^4.3.3
  intl: ^0.19.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
